[package]
name = "hubp"
version = "1.1.1"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "http2", "rustls-tls", "brotli", "gzip", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
http = "1.0"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
futures-util = "0.3"
bytes = "1.0"
dashmap = "6.0"
chrono = "0.4"
ipnet = "2.9"
maxminddb = "0.24"
tower = "0.4"
matchit = "0.7"
hyper = { version = "1.0", features = ["full"] }
sync_wrapper = "1.0"

[profile.release]
opt-level = 'z'     # 优化二进制体积
lto = "thin"        # 瘦 LTO，链接速度远快于 fat LTO，体积差距很小
codegen-units = 4   # 适度并行，GitHub Actions 2核心下编译快 2-3x
strip = true        # 自动剥离符号信息
panic = 'abort'     # 发生 panic 时直接退出，减少标准库体积
